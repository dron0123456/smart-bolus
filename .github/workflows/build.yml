name: Build SmartBolus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/smartbolus/app

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartBolus"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.4.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.smartbolus.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.smartbolus.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 17
                  versionName "1.7.1"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:label="Умный Болюс"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/smartbolus/app/MainActivity.java
          package com.smartbolus.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android:content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.webkit.CookieManager;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.EditText;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayInputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.TimeZone;
          import java.util.UUID;

          public class MainActivity extends Activity {

              private static final String DEFAULT_URL = "https://script.google.com/macros/s/AKfycby8RIP5UPNigRwb0jX6fSSVgS5O6WlyZmPS26LvTsAZI7hhthdtDcFHnEFNcPeF2nW_Aw/exec";
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private Uri cameraImageUri;
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("SmartBolusPrefs", Context.MODE_PRIVATE);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Скрываем верхний системный баннер Google Apps Script
                          String hideBannerJs = "javascript:(function(){" +
                                  "var w = document.getElementById('warning');" +
                                  "if(w) w.style.display='none';" +
                                  "var t = document.getElementById('warning-bar-table');" +
                                  "if(t) t.style.display='none';" +
                                  "})()";
                          view.evaluateJavascript(hideBannerJs, null);
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (uri != null && uri.getPath() != null && uri.getPath().contains("smartbolus-xdrip")) {
                              String insStr = uri.getQueryParameter("insulin");
                              String carbsStr = uri.getQueryParameter("carbs");
                              String notesStr = uri.getQueryParameter("notes");

                              double ins = 0;
                              double carbs = 0;
                              try { if (insStr != null) ins = Double.parseDouble(insStr); } catch (Exception ignored) {}
                              try { if (carbsStr != null) carbs = Double.parseDouble(carbsStr); } catch (Exception ignored) {}

                              sendTreatmentToXDrip(ins, carbs, notesStr);

                              Map<String, String> headers = new HashMap<>();
                              headers.put("Access-Control-Allow-Origin", "*");
                              headers.put("Cache-Control", "no-store");
                              ByteArrayInputStream stream = new ByteArrayInputStream("{\"ok\":true}".getBytes(StandardCharsets.UTF_8));
                              return new WebResourceResponse("application/json", "UTF-8", 200, "OK", headers, stream);
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;

                          try {
                              Intent captureIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Images.Media.TITLE, "smartbolus_" + System.currentTimeMillis() + ".jpg");
                              values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                              cameraImageUri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                              if (cameraImageUri != null) {
                                  captureIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraImageUri);
                              }

                              if (fileChooserParams != null && fileChooserParams.isCaptureEnabled() && cameraImageUri != null) {
                                  startActivityForResult(captureIntent, FILE_CHOOSER_RESULT_CODE);
                              } else {
                                  Intent contentIntent = new Intent(Intent.ACTION_GET_CONTENT);
                                  contentIntent.addCategory(Intent.CATEGORY_OPENABLE);
                                  contentIntent.setType("image/*");

                                  Intent chooserIntent = Intent.createChooser(contentIntent, "Выберите фото тарелки");
                                  if (cameraImageUri != null) {
                                      chooserIntent.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{captureIntent});
                                  }
                                  startActivityForResult(chooserIntent, FILE_CHOOSER_RESULT_CODE);
                              }
                              return true;
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  String savedUrl = prefs.getString("app_url", DEFAULT_URL);
                  webView.loadUrl(savedUrl);
              }

              private void sendTreatmentToXDrip(final double insulin, final double carbs, final String notes) {
                  if (insulin <= 0 && carbs <= 0) return;
                  try {
                      long now = System.currentTimeMillis();
                      SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US);
                      sdf.setTimeZone(TimeZone.getTimeZone("UTC"));

                      JSONObject tx = new JSONObject();
                      tx.put("timestamp", now);
                      tx.put("created_at", sdf.format(new Date(now)));
                      tx.put("eventType", (insulin > 0 && carbs > 0) ? "Meal Bolus" : (insulin > 0 ? "Correction Bolus" : "Carb Correction"));
                      if (insulin > 0) tx.put("insulin", insulin);
                      if (carbs > 0) tx.put("carbs", carbs);
                      tx.put("notes", notes != null ? notes : "Умный Болюс");
                      tx.put("enteredBy", "SmartBolus");
                      tx.put("uuid", UUID.randomUUID().toString());

                      JSONArray arr = new JSONArray();
                      arr.put(tx);

                      Intent intent1 = new Intent("com.eveningoutpost.dexdrip.NS_EMULATOR");
                      intent1.setPackage("com.eveningoutpost.dexdrip");
                      intent1.putExtra("collection", "treatments");
                      intent1.putExtra("data", arr.toString());
                      intent1.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);
                      sendBroadcast(intent1);

                      Intent intent2 = new Intent("com.eveningoutpost.dexdrip.NS_EMULATOR");
                      intent2.putExtra("collection", "treatments");
                      intent2.putExtra("data", arr.toString());
                      intent2.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);
                      sendBroadcast(intent2);

                      new Handler(Looper.getMainLooper()).post(new Runnable() {
                          @Override
                          public void run() {
                              String msg = "💉 Передано в xDrip+: " +
                                      (insulin > 0 ? insulin + " ед. " : "") +
                                      (carbs > 0 ? (int) carbs + " г угл." : "");
                              Toast.makeText(getApplicationContext(), msg, Toast.LENGTH_LONG).show();
                          }
                      });
                  } catch (Exception ignored) {}
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK) {
                          if (data != null && data.getDataString() != null) {
                              results = new Uri[]{Uri.parse(data.getDataString())};
                          } else if (data != null && data.getClipData() != null) {
                              ClipData clipData = data.getClipData();
                              results = new Uri[clipData.getItemCount()];
                              for (int i = 0; i < clipData.getItemCount(); i++) {
                                  results[i] = clipData.getItemAt(i).getUri();
                              }
                          } else if (cameraImageUri != null) {
                              results = new Uri[]{cameraImageUri};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      showMenuDialog();
                  }
              }

              private void showMenuDialog() {
                  String[] options = {"🔄 Обновить страницу", "🔗 Изменить ссылку скрипта", "🚪 Закрыть приложение"};
                  new AlertDialog.Builder(this)
                          .setTitle("Умный Болюс")
                          .setItems(options, new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface dialog, int which) {
                                  if (which == 0) {
                                      webView.reload();
                                  } else if (which == 1) {
                                      showUrlInputDialog();
                                  } else if (which == 2) {
                                      finish();
                                  }
                              }
                          })
                          .show();
              }

              private void showUrlInputDialog() {
                  final EditText input = new EditText(this);
                  input.setText(prefs.getString("app_url", DEFAULT_URL));
                  new AlertDialog.Builder(this)
                          .setTitle("Ссылка Google Apps Script")
                          .setView(input)
                          .setPositiveButton("Сохранить", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface dialog, int which) {
                                  String newUrl = input.getText().toString().trim();
                                  if (!newUrl.isEmpty()) {
                                      prefs.edit().putString("app_url", newUrl).apply();
                                      webView.loadUrl(newUrl);
                                  }
                              }
                          })
                          .setNegativeButton("Отмена", null)
                          .show();
              }
          }
          EOF
          sed -i 's/android:content.SharedPreferences/android.content.SharedPreferences/g' app/src/main/java/com/smartbolus/app/MainActivity.java

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload SmartBolus APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartBolus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
