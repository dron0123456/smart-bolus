name: Build SmartBolus APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Project
        run: |
          mkdir -p app/src/main/java/com/smartbolus/app
          mkdir -p app/src/main/java/com/eveningoutpost/dexdrip/services/broadcastservice/models

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SmartBolus"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.4.0' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.smartbolus.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.smartbolus.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 28
                  versionName "1.8.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <queries>
                  <package android:name="com.eveningoutpost.dexdrip" />
                  <intent><action android:name="com.eveningoutpost.dexdrip.watch.wearintegration.BROADCAST_SERVICE_RECEIVER" /></intent>
                  <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Умный Болюс"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/eveningoutpost/dexdrip/services/broadcastservice/models/Settings.java
          package com.eveningoutpost.dexdrip.services.broadcastservice.models;

          import android.os.Parcel;
          import android.os.Parcelable;

          public class Settings implements Parcelable {
              private int graphStartOffset;
              private int graphEndOffset;
              private String apkName;
              private boolean displayGraph;

              public Settings(int graphStartOffset, int graphEndOffset, String apkName, boolean displayGraph) {
                  this.graphStartOffset = graphStartOffset;
                  this.graphEndOffset = graphEndOffset;
                  this.apkName = apkName;
                  this.displayGraph = displayGraph;
              }

              protected Settings(Parcel in) {
                  graphStartOffset = in.readInt();
                  graphEndOffset = in.readInt();
                  apkName = in.readString();
                  displayGraph = in.readByte() != 0;
              }

              public static final Creator<Settings> CREATOR = new Creator<Settings>() {
                  @Override
                  public Settings createFromParcel(Parcel in) {
                      return new Settings(in);
                  }

                  @Override
                  public Settings[] newArray(int size) {
                      return new Settings[size];
                  }
              };

              @Override
              public int describeContents() {
                  return 0;
              }

              @Override
              public void writeToParcel(Parcel dest, int flags) {
                  dest.writeInt(graphStartOffset);
                  dest.writeInt(graphEndOffset);
                  dest.writeString(apkName);
                  dest.writeByte((byte) (displayGraph ? 1 : 0));
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/smartbolus/app/MainActivity.java
          package com.smartbolus.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ComponentName;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import com.eveningoutpost.dexdrip.services.broadcastservice.models.Settings;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String DEFAULT_URL = "https://script.google.com/macros/s/AKfycby8RIP5UPNigRwb0jX6fSSVgS5O6WlyZmPS26LvTsAZI7hhthdtDcFHnEFNcPeF2nW_Aw/exec";
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;
              private static final String XDRIP_PKG = "com.eveningoutpost.dexdrip";
              private static final String ACTION_BS = "com.eveningoutpost.dexdrip.watch.wearintegration.BROADCAST_SERVICE_RECEIVER";
              private static final String CLS_BS_ENTRY = "com.eveningoutpost.dexdrip.services.broadcastservice.BroadcastEntry";

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private Uri cameraImageUri;
              private SharedPreferences prefs;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private long lastXdripSentTime = 0;

              private static final String BRIDGE_SCRIPT =
                      "<script>(function(){" +
                      "window._callbacks={};window._cbId=0;" +
                      "window._callAndroidServer=function(a,p,s,f){var id=++window._cbId;window._callbacks[id]={ok:s,err:f};if(window.AndroidBridge)window.AndroidBridge.callServer(id,a,p||'');};" +
                      "window._onAndroidServerResult=function(id,ok,b64){var cb=window._callbacks[id];delete window._callbacks[id];if(!cb)return;try{var d=decodeURIComponent(escape(window.atob(b64)));if(ok&&cb.ok)cb.ok(d);else if(!ok&&cb.err)cb.err(d);}catch(e){if(cb.err)cb.err(e.toString());}};" +
                      "function cr(s,f){return{withSuccessHandler:function(fn){return cr(fn,f);},withFailureHandler:function(fn){return cr(s,fn);},getAppState:function(){window._callAndroidServer('getState','',s,f);},saveCloudSettings:function(x){window._callAndroidServer('saveSettings',JSON.stringify(x),s,f);},addCloudRecord:function(r){window._callAndroidServer('addRecord',JSON.stringify(r),s,f);},deleteCloudRecord:function(t){window._callAndroidServer('deleteRecord',String(t),s,f);}};}" +
                      "window.google={script:{run:cr(null,null)}};" +
                      "})();</script>";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("SmartBolusPrefs", Context.MODE_PRIVATE);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  CookieManager.getInstance().setAcceptCookie(true);
                  webView.addJavascriptInterface(new WebAppInterface(), "AndroidBridge");

                  sendXdripRegister();

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (uri != null && uri.toString().contains("127.0.0.1:17580")) {
                              try {
                                  String json = fetchHttpUrl(uri.toString());
                                  Map<String, String> headers = new HashMap<>();
                                  headers.put("Access-Control-Allow-Origin", "*");
                                  headers.put("Cache-Control", "no-store");
                                  return new WebResourceResponse("application/json", "UTF-8", 200, "OK", headers, new ByteArrayInputStream(json.getBytes(StandardCharsets.UTF_8)));
                              } catch (Exception ignored) {}
                          }
                          return super.shouldInterceptRequest(view, request);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = cb;
                          try {
                              if (params != null && params.isCaptureEnabled()) {
                                  Intent captureIntent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.Images.Media.TITLE, "sb_" + System.currentTimeMillis() + ".jpg");
                                  values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                                  cameraImageUri = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);
                                  if (cameraImageUri != null) captureIntent.putExtra(MediaStore.EXTRA_OUTPUT, cameraImageUri);
                                  startActivityForResult(captureIntent, FILE_CHOOSER_RESULT_CODE);
                              } else {
                                  cameraImageUri = null;
                                  Intent pickIntent = new Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                                  pickIntent.setType("image/*");
                                  startActivityForResult(pickIntent, FILE_CHOOSER_RESULT_CODE);
                              }
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  String cachedHtml = prefs.getString("cached_html", null);
                  if (cachedHtml != null && !cachedHtml.isEmpty()) {
                      renderHtml(cachedHtml);
                      fetchLatestHtml(false);
                  } else {
                      fetchLatestHtml(true);
                  }
              }

              private void sendXdripRegister() {
                  try {
                      Settings xdripSettings = new Settings(0, 0, "Умный Болюс", false);
                      Intent reg = new Intent(ACTION_BS);
                      reg.setComponent(new ComponentName(XDRIP_PKG, CLS_BS_ENTRY));
                      reg.putExtra("PACKAGE", getPackageName());
                      reg.putExtra("FUNCTION", "set_settings");
                      reg.putExtra("SETTINGS", xdripSettings);
                      reg.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES | Intent.FLAG_RECEIVER_FOREGROUND);
                      sendBroadcast(reg);
                  } catch (Exception ignored) {}
              }

              private void renderHtml(String rawHtml) {
                  String full = rawHtml.contains("<head>") ? rawHtml.replace("<head>", "<head>" + BRIDGE_SCRIPT) : (BRIDGE_SCRIPT + rawHtml);
                  webView.loadDataWithBaseURL("https://smartbolus.local/", full, "text/html", "UTF-8", null);
              }

              private void fetchLatestHtml(final boolean force) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              String u = prefs.getString("app_url", DEFAULT_URL);
                              final String html = fetchHttpUrl(u + (u.contains("?") ? "&" : "?") + "apk=1&_t=" + System.currentTimeMillis());
                              if (html != null && html.contains("<!DOCTYPE html>")) {
                                  String old = prefs.getString("cached_html", "");
                                  prefs.edit().putString("cached_html", html).apply();
                                  if (force || !html.equals(old)) {
                                      mainHandler.post(new Runnable() { @Override public void run() { renderHtml(html); } });
                                  }
                              }
                          } catch (Exception ignored) {}
                      }
                  }).start();
              }

              private String fetchHttpUrl(String urlStr) throws Exception {
                  URL url = new URL(urlStr);
                  HttpURLConnection conn = null;
                  for (int i = 0; i < 6; i++) {
                      conn = (HttpURLConnection) url.openConnection();
                      conn.setInstanceFollowRedirects(false);
                      conn.setConnectTimeout(15000);
                      conn.setReadTimeout(20000);
                      int c = conn.getResponseCode();
                      if (c == 301 || c == 302 || c == 303 || c == 307 || c == 308) {
                          String loc = conn.getHeaderField("Location");
                          conn.disconnect();
                          url = new URL(url, loc);
                      } else break;
                  }
                  InputStream is = (conn.getResponseCode() >= 400) ? conn.getErrorStream() : conn.getInputStream();
                  BufferedReader r = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = r.readLine()) != null) sb.append(line).append("\n");
                  r.close();
                  conn.disconnect();
                  return sb.toString();
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public String getPhoneTimeStr() {
                      return new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());
                  }

                  @JavascriptInterface
                  public double getPhoneHourFloat() {
                      Calendar cal = Calendar.getInstance();
                      return cal.get(Calendar.HOUR_OF_DAY) + (cal.get(Calendar.MINUTE) / 60.0);
                  }

                  @JavascriptInterface
                  public void callServer(final int cbId, final String action, final String payload) {
                      if ("addRecord".equals(action) && payload != null) {
                          try {
                              JSONObject rec = new JSONObject(payload);
                              String type = rec.optString("type", "bolus");
                              if ("bolus".equals(type) || "food_only".equals(type)) {
                                  double units = rec.optDouble("units", 0);
                                  double xe = Double.parseDouble(rec.optString("xe", "0").replace(",", "."));
                                  double carbs = rec.has("carbs") ? rec.optDouble("carbs", Math.round(xe * 10.0)) : Math.round(xe * 10.0);
                                  sendTreatmentToXDrip(units, carbs);
                              }
                          } catch (Exception ignored) {}
                      }
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  String u = prefs.getString("app_url", DEFAULT_URL);
                                  String req = u + (u.contains("?") ? "&" : "?") + "action=" + URLEncoder.encode(action, "UTF-8") + "&data=" + URLEncoder.encode(payload != null ? payload : "", "UTF-8") + "&_t=" + System.currentTimeMillis();
                                  String res = fetchHttpUrl(req);
                                  final String b64 = android.util.Base64.encodeToString(res.getBytes(StandardCharsets.UTF_8), android.util.Base64.NO_WRAP);
                                  mainHandler.post(new Runnable() { @Override public void run() { webView.evaluateJavascript("window._onAndroidServerResult(" + cbId + ",true,'" + b64 + "');", null); } });
                              } catch (Exception e) {
                                  final String b64 = android.util.Base64.encodeToString(e.toString().getBytes(StandardCharsets.UTF_8), android.util.Base64.NO_WRAP);
                                  mainHandler.post(new Runnable() { @Override public void run() { webView.evaluateJavascript("window._onAndroidServerResult(" + cbId + ",false,'" + b64 + "');", null); } });
                              }
                          }
                      }).start();
                  }
              }

              private synchronized void sendTreatmentToXDrip(final double insulin, final double carbs) {
                  if (insulin <= 0 && carbs <= 0) return;
                  final long now = System.currentTimeMillis();
                  if (now - lastXdripSentTime < 2000) return;
                  lastXdripSentTime = now;

                  // Шаг 1: Регистрация с родным классом Settings из xDrip+
                  sendXdripRegister();

                  // Шаг 2: Пауза ровно 1.5 сек (чтобы анти-спам xDrip+ не сбросил команду) и отправка записи
                  mainHandler.postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              Intent bsIntent = new Intent(ACTION_BS);
                              bsIntent.setComponent(new ComponentName(XDRIP_PKG, CLS_BS_ENTRY));
                              bsIntent.putExtra("PACKAGE", getPackageName());
                              bsIntent.putExtra("FUNCTION", "add_treatment");
                              bsIntent.putExtra("carbs", (double) carbs);
                              bsIntent.putExtra("insulin", (double) insulin);
                              bsIntent.putExtra("timeStamp", (long) now);
                              bsIntent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES | Intent.FLAG_RECEIVER_FOREGROUND);
                              sendBroadcast(bsIntent);

                              Toast.makeText(getApplicationContext(), "💉 Отправлено в xDrip+: " + insulin + " ед. / " + (int)carbs + " г угл.", Toast.LENGTH_SHORT).show();
                          } catch (Exception ignored) {}
                      }
                  }, 1500);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE && filePathCallback != null) {
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK) {
                          if (data != null && data.getDataString() != null) {
                              results = new Uri[]{Uri.parse(data.getDataString())};
                          } else if (cameraImageUri != null) {
                              results = new Uri[]{cameraImageUri};
                          }
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  String[] ops = {"🔄 Загрузить обновления с сервера", "🚪 Закрыть"};
                  new AlertDialog.Builder(this).setTitle("Умный Болюс").setItems(ops, new DialogInterface.OnClickListener() {
                      @Override
                      public void onClick(DialogInterface d, int w) {
                          if (w == 0) fetchLatestHtml(true);
                          else finish();
                      }
                  }).show();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SmartBolus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
